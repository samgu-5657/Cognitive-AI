<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cognitive AI · 本地认知工作台</title>
<style>
body { font-family: sans-serif; max-width: 900px; margin: 1em auto; }
section { border: 1px solid #ccc; padding: 0.8em; margin-bottom: 1em; }
textarea, input[type=text] { width: 95%; }
pre { background: #f4f4f4; padding: 0.5em; white-space: pre-wrap; }
button { margin: 0.2em; }
.prior { margin: 0.2em 0; }
</style>
</head>
<body>
<h1>Cognitive AI · 本地认知工作台</h1>

<section>
<h2>一、交互与问答</h2>
<textarea id="q" rows="3">杯子是容器，而且杯子可以盛水</textarea><br>
<button onclick="go('/api/ask')">知识问答</button>
<button onclick="go('/api/analyze')">语义分析</button>
<button onclick="propose()">提出知识候选</button>
<pre id="out1">等待输入……</pre>
<details><summary>JSON 诊断</summary><pre id="json1"></pre></details>
</section>

<section>
<h2>二、上下文实验（只保存在本页，不写入知识库）</h2>
<input type="text" id="priorInput" value="杯子是容器">
<button onclick="addPrior()">添加先前陈述</button>
<button onclick="clearPriors()">清空</button>
<div id="priors"></div>
<input type="text" id="ctxq" value="它可以盛水">
<button onclick="ctx()">上下文分析</button>
<pre id="out2">等待输入……</pre>
<details><summary>JSON 诊断</summary><pre id="json2"></pre></details>
</section>

<section>
<h2>三、知识教学与审核</h2>
<input type="text" id="teach" value="杯子有把手">
<button onclick="propose2()">提交候选</button>
<button onclick="listPending()">刷新候选列表</button>
<pre id="out3">等待输入……</pre>
<div id="pending"></div>
</section>

<script>
const priors = [];
async function call(path, body, out, diag) {
  const r = await fetch(path, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)});
  const data = await r.json();
  document.getElementById(out).textContent =
    data.ok ? summarize(path, data) : ("错误：" + data.error);
  document.getElementById(diag).textContent =
    JSON.stringify(data, null, 2).slice(0, 4000);
  return data;
}
function summarize(path, data) {
  if (path === "/api/ask") return "回答：" + data.answer;
  if (path === "/api/analyze")
    return "根节点：" + data.report.root.kind +
      " [" + data.report.root.status + "] 完整=" + data.report.complete;
  if (path === "/api/context") {
    const R = data.report;
    let s = "规范化：" + R.normalized_text + "\n";
    for (const r of R.resolutions)
      s += "指代" + r.mention + "：" + r.status + " " + r.reason + "\n";
    s += "完整=" + R.complete;
    return s;
  }
  if (path === "/api/interact") {
    const R = data.result || {};
    let s = "状态：" + R.state + "\n";
    if (R.request) s += "问题：" + R.request.question + "\n";
    return s;
  }
  if (path === "/api/answer") {
    const R = data.result || {};
    return "状态：" + R.state;
  }
  return JSON.stringify(data).slice(0, 500);
}
async function go(path) {
  await call(path, {text: document.getElementById("q").value},
             "out1", "json1");
}
async function propose() {
  await call("/api/propose", {text: document.getElementById("q").value},
             "out1", "json1");
}
function renderPriors() {
  document.getElementById("priors").innerHTML = priors.map(
    (p, i) => `<div class="prior">${i}: ${p} <button onclick="delPrior(${i})">删除</button></div>`).join("");
}
function addPrior() {
  const v = document.getElementById("priorInput").value;
  if (v.trim()) { priors.push(v); renderPriors(); }
}
function delPrior(i) { priors.splice(i, 1); renderPriors(); }
function clearPriors() { priors.length = 0; renderPriors(); }
async function ctx() {
  lastRequest = null;
  const data = await call("/api/interact",
    {priors: priors.slice(),
     text: document.getElementById("ctxq").value}, "out2", "json2");
  if (data.ok && data.result && data.result.state === "needs_clarification"
      && data.result.request) {
    lastRequest = data.result.request;
    showOptions(data.result.request);
  }
}
let lastRequest = null;
function showOptions(req) {
  const box = document.getElementById("out2");
  let html = "<div>需要澄清：" + req.question + "</div>";
  for (const o of (req.options || [])) {
    html += `<div><button ${o.selectable ? "" : "disabled"} ` +
      `onclick="answer('${o.option_id}')">${o.display_name}</button>` +
      (o.selectable ? "" : "（不可选：" + o.reason + "）") + "</div>";
  }
  html += `<div><button onclick="cancelClarify()">取消澄清</button></div>`;
  const d = document.createElement("div");
  d.innerHTML = html;
  box.appendChild(d);
}
async function answer(optionId) {
  if (!lastRequest) return;
  const data = await call("/api/answer",
    {request: lastRequest,
     answer: {request_id: lastRequest.request_id,
              option_id: optionId},
     priors: priors.slice(),
     text: document.getElementById("ctxq").value}, "out2", "json2");
  if (data.ok && data.result) {
    const R = data.result;
    let s = "状态：" + R.state + "\n";
    if (R.understanding)
      s += "规范化：" + R.understanding.raw_input + "\n";
    document.getElementById("out2").textContent = s;
    lastRequest = null;
  }
}
function cancelClarify() {
  lastRequest = null;
  document.getElementById("out2").textContent = "已取消澄清，保留原始输入。";
}
async function propose2() {
  const data = await call("/api/propose",
    {text: document.getElementById("teach").value}, "out3", "out3");
  await listPending();
}
async function listPending() {
  const r = await fetch("/api/pending");
  const data = await r.json();
  const box = document.getElementById("pending");
  box.innerHTML = (data.candidates || []).map(c =>
    `<div>#${c.id} [${c.status}] ${c.utterance} (${c.kind}) ` +
    `<button onclick="decide(${c.id},'confirm')">确认</button>` +
    `<button onclick="decide(${c.id},'reject')">拒绝</button></div>`
  ).join("") || "暂无待审核候选";
  document.getElementById("out3").textContent =
    "候选数：" + (data.candidates || []).length;
}
async function decide(id, how) {
  const r = await fetch("/api/" + how, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id})});
  const data = await r.json();
  document.getElementById("out3").textContent = data.ok ?
    (how === "confirm" ? "已确认：" : "已拒绝：") + JSON.stringify(data) :
    ("错误：" + data.error);
  await listPending();
}
renderPriors();
</script>
</body>
</html>
