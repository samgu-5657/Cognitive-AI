[project]
name = "cognitive-ai"
version = "0.1.0"
description = "Cognitive AI - continuously learning artificial cognitive system (Phase 1 prototype)"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
