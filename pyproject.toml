[project]
name = "cognitive-ai"
version = "0.1.0"
description = "Rule-based concept knowledge base with evidence-gated learning and an optional character-level CNN classifier"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]
neural = ["torch>=2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
